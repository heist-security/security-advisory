name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Verify registry generation
        run: |
          npm run sources:build -- --migration=299901010001_ci_registry.sql
          git diff --exit-code -- docs/source-coverage.md
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run check:secrets
