name: Production
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
# Hold the lock through migration AND Vercel readiness. Never interrupt running DDL.
concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/check.yml
  browser:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/browser.yml
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.122.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify schema installation, cutover and idempotent retry
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: postgres
          DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          supabase db push --db-url "$DATABASE_URL?sslmode=disable" --yes
          first=$(psql -At -c 'select count(*) from supabase_migrations.schema_migrations')
          expected=$(find supabase/migrations -name '*.sql' -type f | wc -l)
          test "$first" -eq "$expected"
          npm run feed:migrate
          npm run feed:migrate
          supabase db push --db-url "$DATABASE_URL?sslmode=disable" --yes
          second=$(psql -At -c 'select count(*) from supabase_migrations.schema_migrations')
          test "$first" -eq "$second"
      - name: Populated upgrade and repository contract on PostgreSQL 17
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
        run: npx vitest run tests/canonical-database.test.ts tests/feed-pagination.test.ts
  release:
    needs: [check, browser, migrations]
    if: >-
      github.repository == 'heist-security/security-advisory' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.122.0
      - run: npm ci
      - name: Migrate, then deploy the checked commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: node .github/scripts/release.mjs
